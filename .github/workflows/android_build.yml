name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # Actualiza automáticamente la versión de Gradle Wrapper a la 8.5 (compatible con Java 17)
    - name: Upgrade Gradle Wrapper to 8.5
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradlew no encontrado, instalando sistema base..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.5
        else
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    # Compila el APK con Gradle 8.5 y Java 17
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace -x test -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4.6.1
      with:
        name: AdwareShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
