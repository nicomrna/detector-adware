name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Verifica si existe gradlew; si no está, instala Gradle temporalmente para generarlo
    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradlew no encontrado. Instalando Gradle..."
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
        fi
        chmod +x gradlew

    # Compilación con informe de errores extendido
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info -x test -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AdwareShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
