name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente si lo deseas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Genera el wrapper de Gradle si no existe en el repositorio
    - name: Setup Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    # Compila el archivo APK ignorando errores de linting menores
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace -x test -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AdwareShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
