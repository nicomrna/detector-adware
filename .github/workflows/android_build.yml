name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up JDK 17
      uses: actions/setup-java@v4.7.0
      with:
        java-version: '17'
        distribution: 'temurin'

    # Fuerza la instalación limpia de Gradle 8.7 para cumplir con el plugin de Android
    - name: Force Install Gradle 8.7 Wrapper
      run: |
        wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
        unzip -q gradle-8.7-bin.zip
        ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # Compila el APK con el motor 8.7
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace -x test -x lint

    - name: Upload APK
      uses: actions/upload-artifact@v4.6.1
      with:
        name: AdwareShield-APK
        path: app/build/outputs/apk/debug/app-debug.apk
